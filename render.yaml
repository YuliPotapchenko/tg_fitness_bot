# Render Blueprint: можно создать сервис через New -> Blueprint, либо вручную по инструкции из README.
services:
  - type: web
    name: fitness-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TILDA_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: TIMEZONE
        value: Europe/Moscow
